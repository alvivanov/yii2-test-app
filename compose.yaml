services:
  app:
    build:
      target: development
      args:
        - 'xdebug=${XDEBUG:-false}'
    container_name: '${APP_CONTAINER_NAME}'
    working_dir: /app
    volumes:
      - ./:/app:cached
    command:
      - php
      - yii
      - serve
      - 0.0.0.0
    ports:
      - '${APP_EXTERNAL_PORT}:8080'
    environment:
      PHP_IDE_CONFIG: serverName=Docker
      XDEBUG_CONFIG: client_host=${XDEBUG_CLIENT_HOST} client_port=${XDEBUG_CLIENT_PORT} idekey=PHPSTORM log_level=0
      XDEBUG_MODE: debug
    networks:
      - local
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
  db:
    image: mysql:9.6
    container_name: '${DB_CONTAINER_NAME}'
    environment:
      MYSQL_PASSWORD: '${DB_PASSWORD}'
      MYSQL_DATABASE: '${DB_DATABASE}'
      MYSQL_USER: '${DB_USERNAME}'
      MYSQL_ALLOW_EMPTY_PASSWORD: true
    healthcheck:
      test: [ "CMD", "mysqladmin", "ping", "-h", "localhost" ]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - local
    ports:
      - '${DB_EXTERNAL_PORT}:3306'
  test_db:
    image: mysql:9.6
    container_name: '${TEST_DB_CONTAINER_NAME}'
    environment:
      MYSQL_PASSWORD: '${DB_PASSWORD}'
      MYSQL_DATABASE: '${DB_DATABASE}'
      MYSQL_USER: '${DB_USERNAME}'
      MYSQL_ALLOW_EMPTY_PASSWORD: true
    healthcheck:
      test: [ "CMD", "mysqladmin", "ping", "-h", "localhost" ]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - local
  redis:
    image: redis:8.6-alpine
    container_name: '${REDIS_CONTAINER_NAME}'
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - local
networks:
  local:
    ipam:
      driver: default
      config:
        - subnet: ${SUBNET}
